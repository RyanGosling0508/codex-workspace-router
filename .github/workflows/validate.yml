name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check package and links
        run: python -X utf8 -B scripts/check_package.py
      - name: Test routing invariants
        run: python -X utf8 -B -m unittest discover -s workspace-router/tests -v
      - name: Test installer and rollback safeguards
        run: python -X utf8 -B -m unittest discover -s . -p test_installer.py -v
