<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="485" viewBox="0 0 1200 485" role="img" aria-labelledby="title desc">
<title id="title">模型与 effort：两个旋钮，不是一条能力刻度</title><desc id="desc">Official explicit starting efforts: Luna high, Sol medium, Astra low. No equivalence is implied.</desc>
<g font-family="Segoe UI, Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1200" height="485" rx="24" fill="#f5f7f2" stroke="#dbe5dc"/><text x="40" y="47" font-size="14" fill="#617568" font-weight="600">01 / MODEL × EFFORT</text><text x="40" y="91" font-size="30" fill="#203f34" font-weight="600">模型与 effort：两个旋钮，不是一条能力刻度</text><rect x="40" y="123" width="1120" height="65" rx="18" fill="#ffffff" stroke="#dbe5dc"/><text x="61" y="164" font-size="24" fill="#294a40" font-weight="600">Luna</text><text x="244" y="164" font-size="20" fill="#586f61" font-weight="400">聚焦、清晰、可核验</text><text x="850" y="164" font-size="20" fill="#365e4c" font-weight="600">START  high</text><rect x="40" y="203" width="1120" height="65" rx="18" fill="#ffffff" stroke="#dbe5dc"/><text x="61" y="244" font-size="24" fill="#294a40" font-weight="600">Sol</text><text x="244" y="244" font-size="20" fill="#586f61" font-weight="400">通用实现与复杂工作</text><text x="850" y="244" font-size="20" fill="#365e4c" font-weight="600">START  medium</text><rect x="40" y="283" width="1120" height="65" rx="18" fill="#ffffff" stroke="#dbe5dc"/><text x="61" y="324" font-size="24" fill="#294a40" font-weight="600">Astra</text><text x="244" y="324" font-size="20" fill="#586f61" font-weight="400">困难的完整工作流</text><text x="850" y="324" font-size="20" fill="#365e4c" font-weight="600">START  low</text><text x="40" y="402" font-size="19" fill="#365e4c" font-weight="600">官方显式配置起点 ≠ 本项目每一档的固定配对</text><text x="40" y="440" font-size="18" fill="#66796c" font-weight="400">同名 effort 不保证跨模型等价；提高 effort 不会更换模型。</text></g></svg>