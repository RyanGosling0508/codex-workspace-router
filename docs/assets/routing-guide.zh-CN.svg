<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="552" viewBox="0 0 1200 552" role="img" aria-labelledby="title desc">
<title id="title">从任务证据，到可验收的委派</title><desc id="desc">Need, classify, select, accept. Source trials retain their routine classification.</desc>
<g font-family="Segoe UI, Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1200" height="552" rx="24" fill="#eef3eb" stroke="#dbe5dc"/><text x="40" y="47" font-size="14" fill="#617568" font-weight="600">02 / ROUTING LOGIC</text><text x="40" y="91" font-size="32" fill="#203f34" font-weight="600">从任务证据，到可验收的委派</text><rect x="40" y="119" width="1120" height="75" rx="18" fill="#ffffff" stroke="#dbe5dc"/><rect x="58" y="135" width="43" height="43" rx="12" fill="#294a40" stroke="#294a40"/><text x="67" y="163" font-size="18" fill="#e2edb1" font-weight="600">01</text><text x="119" y="152" font-size="20" fill="#294a40" font-weight="600">确需委派？</text><text x="306" y="152" font-size="19" fill="#405d4e" font-weight="400">明确请求 / 独立复核 / 并行速度</text><text x="306" y="179" font-size="16" fill="#738170" font-weight="400">无理由 → 主代理直接做</text><rect x="40" y="210" width="1120" height="75" rx="18" fill="#ffffff" stroke="#dbe5dc"/><rect x="58" y="226" width="43" height="43" rx="12" fill="#294a40" stroke="#294a40"/><text x="67" y="254" font-size="18" fill="#e2edb1" font-weight="600">02</text><text x="119" y="243" font-size="20" fill="#294a40" font-weight="600">证据定档</text><text x="306" y="243" font-size="19" fill="#405d4e" font-weight="400">机械 → 常规 → 复杂 → 关键</text><text x="306" y="270" font-size="16" fill="#738170" font-weight="400">最高命中规则生效</text><rect x="40" y="301" width="1120" height="75" rx="18" fill="#ffffff" stroke="#dbe5dc"/><rect x="58" y="317" width="43" height="43" rx="12" fill="#294a40" stroke="#294a40"/><text x="67" y="345" font-size="18" fill="#e2edb1" font-weight="600">03</text><text x="119" y="334" font-size="20" fill="#294a40" font-weight="600">可用候选</text><text x="306" y="334" font-size="19" fill="#405d4e" font-weight="400">策略 + 显式选择 + 当前主机能力</text><text x="306" y="361" font-size="16" fill="#738170" font-weight="400">不支持 → 不静默替换</text><rect x="40" y="392" width="1120" height="75" rx="18" fill="#ffffff" stroke="#dbe5dc"/><rect x="58" y="408" width="43" height="43" rx="12" fill="#294a40" stroke="#294a40"/><text x="67" y="436" font-size="18" fill="#e2edb1" font-weight="600">04</text><text x="119" y="425" font-size="20" fill="#294a40" font-weight="600">主代理验收</text><text x="306" y="425" font-size="19" fill="#405d4e" font-weight="400">核对成果、引用、测试和范围</text><text x="306" y="452" font-size="16" fill="#738170" font-weight="400">完成报告 ≠ 正确证明</text><text x="40" y="520" font-size="18" fill="#536d5a" font-weight="400">来源试用保留 routine 下限；环境故障不触发推理升档。</text></g></svg>