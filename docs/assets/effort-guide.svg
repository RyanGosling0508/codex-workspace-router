<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="485" viewBox="0 0 1200 485" role="img" aria-labelledby="title desc">
<title id="title">Model and effort: separate controls</title><desc id="desc">Official explicit starting efforts: Luna high, Sol medium, Astra low. No equivalence is implied.</desc>
<g font-family="Segoe UI, Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1200" height="485" rx="24" fill="#f5f7f2" stroke="#dbe5dc"/><text x="40" y="47" font-size="14" fill="#617568" font-weight="600">01 / MODEL × EFFORT</text><text x="40" y="91" font-size="30" fill="#203f34" font-weight="600">Model and effort: separate controls</text><rect x="40" y="123" width="1120" height="65" rx="18" fill="#ffffff" stroke="#dbe5dc"/><text x="61" y="164" font-size="24" fill="#294a40" font-weight="600">Luna</text><text x="244" y="164" font-size="20" fill="#586f61" font-weight="400">Focused, clear, checkable</text><text x="850" y="164" font-size="20" fill="#365e4c" font-weight="600">START  high</text><rect x="40" y="203" width="1120" height="65" rx="18" fill="#ffffff" stroke="#dbe5dc"/><text x="61" y="244" font-size="24" fill="#294a40" font-weight="600">Sol</text><text x="244" y="244" font-size="20" fill="#586f61" font-weight="400">General and complex work</text><text x="850" y="244" font-size="20" fill="#365e4c" font-weight="600">START  medium</text><rect x="40" y="283" width="1120" height="65" rx="18" fill="#ffffff" stroke="#dbe5dc"/><text x="61" y="324" font-size="24" fill="#294a40" font-weight="600">Astra</text><text x="244" y="324" font-size="20" fill="#586f61" font-weight="400">Hard end-to-end workflows</text><text x="850" y="324" font-size="20" fill="#365e4c" font-weight="600">START  low</text><text x="40" y="402" font-size="19" fill="#365e4c" font-weight="600">Official explicit starting points are not fixed pairings for every Router lane.</text><text x="40" y="440" font-size="18" fill="#66796c" font-weight="400">The same effort label does not imply equal capability across models.</text></g></svg>