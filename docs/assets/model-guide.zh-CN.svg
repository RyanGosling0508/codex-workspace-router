<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="438" viewBox="0 0 1200 438" role="img" aria-labelledby="title desc">
<title id="title">读懂模型，才能设计好路由</title><desc id="desc">Three independent controls: model, effort, delegation.</desc>
<g font-family="Segoe UI, Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1200" height="438" rx="24" fill="#eef3eb" stroke="#dbe5dc"/><text x="44" y="51" font-size="14" fill="#5b7766" font-weight="600">WORKSPACE ROUTER  /  FIELD GUIDE</text><text x="44" y="111" font-size="38" fill="#203f34" font-weight="650">读懂模型，才能设计好路由</text><text x="44" y="150" font-size="19" fill="#617568" font-weight="400">三个独立问题 · 官方定义 × 工程选择 × 验证证据</text><rect x="44" y="187" width="358" height="171" rx="18" fill="#ffffff" stroke="#dbe5dc"/><text x="66" y="221" font-size="14" fill="#738b62" font-weight="600">01</text><text x="102" y="221" font-size="14" fill="#5d7867" font-weight="600">模型能力</text><text x="66" y="270" font-size="25" fill="#294a40" font-weight="600">选择谁来做</text><text x="66" y="316" font-size="16" fill="#64786a" font-weight="400">Luna  /  Sol  /  Astra</text><rect x="421" y="187" width="358" height="171" rx="18" fill="#ffffff" stroke="#dbe5dc"/><text x="443" y="221" font-size="14" fill="#738b62" font-weight="600">02</text><text x="479" y="221" font-size="14" fill="#5d7867" font-weight="600">推理强度</text><text x="443" y="270" font-size="25" fill="#294a40" font-weight="600">投入多少思考</text><text x="443" y="316" font-size="16" fill="#64786a" font-weight="400">low  /  medium  /  high  /  xhigh</text><rect x="798" y="187" width="358" height="171" rx="18" fill="#ffffff" stroke="#dbe5dc"/><text x="820" y="221" font-size="14" fill="#738b62" font-weight="600">03</text><text x="856" y="221" font-size="14" fill="#5d7867" font-weight="600">委派策略</text><text x="820" y="270" font-size="25" fill="#294a40" font-weight="600">是否值得拆出去</text><text x="820" y="316" font-size="16" fill="#64786a" font-weight="400">Direct  /  Delegate  /  Verify</text><text x="44" y="401" font-size="17" fill="#5a7061" font-weight="400">先判断委派必要性，再选择模型与强度。图中不包含性能评分。</text></g></svg>