<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="438" viewBox="0 0 1200 438" role="img" aria-labelledby="title desc">
<title id="title">Understand the model. Design the route.</title><desc id="desc">Three independent controls: model, effort, delegation.</desc>
<g font-family="Segoe UI, Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1200" height="438" rx="24" fill="#eef3eb" stroke="#dbe5dc"/><text x="44" y="51" font-size="14" fill="#5b7766" font-weight="600">WORKSPACE ROUTER  /  FIELD GUIDE</text><text x="44" y="111" font-size="38" fill="#203f34" font-weight="650">Understand the model. Design the route.</text><text x="44" y="150" font-size="19" fill="#617568" font-weight="400">Three separate questions. Official guidance, engineering choices, evidence.</text><rect x="44" y="187" width="358" height="171" rx="18" fill="#ffffff" stroke="#dbe5dc"/><text x="66" y="221" font-size="14" fill="#738b62" font-weight="600">01</text><text x="102" y="221" font-size="14" fill="#5d7867" font-weight="600">MODEL</text><text x="66" y="270" font-size="25" fill="#294a40" font-weight="600">Who does the work?</text><text x="66" y="316" font-size="16" fill="#64786a" font-weight="400">Luna  /  Sol  /  Astra</text><rect x="421" y="187" width="358" height="171" rx="18" fill="#ffffff" stroke="#dbe5dc"/><text x="443" y="221" font-size="14" fill="#738b62" font-weight="600">02</text><text x="479" y="221" font-size="14" fill="#5d7867" font-weight="600">EFFORT</text><text x="443" y="270" font-size="25" fill="#294a40" font-weight="600">How much reasoning?</text><text x="443" y="316" font-size="16" fill="#64786a" font-weight="400">low  /  medium  /  high  /  xhigh</text><rect x="798" y="187" width="358" height="171" rx="18" fill="#ffffff" stroke="#dbe5dc"/><text x="820" y="221" font-size="14" fill="#738b62" font-weight="600">03</text><text x="856" y="221" font-size="14" fill="#5d7867" font-weight="600">DELEGATION</text><text x="820" y="270" font-size="25" fill="#294a40" font-weight="600">Is a child worthwhile?</text><text x="820" y="316" font-size="16" fill="#64786a" font-weight="400">Direct  /  Delegate  /  Verify</text><text x="44" y="401" font-size="17" fill="#5a7061" font-weight="400">Establish delegation need first. These diagrams contain no performance scores.</text></g></svg>